<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>Nepa AI</title>
    <link rel="icon" type="image/png" href="pro.png">
    <style>
        /* Google Font */
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: linear-gradient(135deg, #001B48, #003893, #00509D, #1E90FF);
            background-size: 400% 400%;
            animation: bgShift 15s ease infinite;
            color: white;
            padding: 0 15px 40px 15px;
        }

        @keyframes bgShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Header */
        .header {
            width: 100%;
            max-width: 800px;
            padding: 20px;
            margin-top: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            border-radius: 16px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.25);
            flex-wrap: wrap;
        }

        /* Nepal Flag */
        .flag {
            width: 50px;
            height: 65px;
            background-image: url("https://upload.wikimedia.org/wikipedia/commons/9/9b/Flag_of_Nepal.svg");
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            transform-origin: left center;
            animation: wave 2.5s ease-in-out infinite;
        }

        @keyframes wave {
            0% { transform: rotate(-3deg); }
            25% { transform: rotate(3deg); }
            50% { transform: rotate(-2deg); }
            75% { transform: rotate(2deg); }
            100% { transform: rotate(-3deg); }
        }

        /* Title */
        h1 {
            font-size: clamp(2rem, 5vw, 3rem);
            color: #fff;
            font-weight: 700;
            letter-spacing: 2px;
            text-shadow: 0 0 8px white, 0 0 20px #8fd3ff, 0 0 35px #4fc3f7;
            text-align: center;
        }

        /* Main Container for Inputs & Responses */
        .main-content {
            width: 100%;
            max-width: 750px;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 30px;
        }

        /* Input */
        input {
            width: 100%;
            max-width: 100%;
            margin-top: 20px;
            padding: 16px 20px;
            border: none;
            outline: none;
            border-radius: 12px;
            font-size: 1rem;
            color: white;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(15px);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.15);
            transition: box-shadow 0.3s ease;
        }

        input:focus {
            box-shadow: 0 0 25px rgba(79, 195, 247, 0.5);
        }

        input::placeholder {
            color: #ddd;
        }

        /* Button */
        button {
            margin-top: 20px;
            padding: 14px 35px;
            border: none;
            border-radius: 10px;
            font-size: 1.05rem;
            font-weight: 600;
            background: #DC143C;
            color: white;
            cursor: pointer;
            transition: transform 0.3s, background 0.35s;
            box-shadow: 0 4px 15px rgba(220, 20, 60, 0.4);
        }

        button:hover {
            background: white;
            color: #003893;
            transform: scale(1.05);
        }

        /* Response Box */
        #response {
            width: 100%;
            max-width: 100%;
            min-height: 160px;
            margin-top: 25px;
            padding: 22px;
            border-radius: 15px;
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(15px);
            color: white;
            line-height: 1.7;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
            word-break: break-word;
        }

        /* Responsive Desktop & Laptop Adjustments */
        @media (min-width: 1024px) {
            .main-content {
                max-width: 700px;
            }
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="flag"></div>
        <h1>Nepa AI</h1>
    </div>

    <div class="main-content">
        <input id="userInput" placeholder="Ask me anything...">
        <button onclick="askNepa()">Send</button>
        <p id="response"></p>
    </div>

    <script>
        async function askNepa() {
            const userInput = document.getElementById('userInput').value;
            const responseElement = document.getElementById('response');
            
            if (!userInput.trim()) {
                responseElement.innerText = "Please type a prompt first!";
                return;
            }

            responseElement.innerText = "Thinking...";

            try {
                const res = await fetch('http://localhost:3000/ask', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: userInput }) 
                });
                
                const data = await res.json();
                
                if (res.ok) {
                    responseElement.innerText = data.reply;
                } else {
                    responseElement.innerText = "Error: " + data.error;
                }
            } catch (err) {
                responseElement.innerText = "Error: Could not connect to server.";
            }
        }
    </script>
</body>
</html>
