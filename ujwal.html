        /* 1. Reset and Layout Setup */
        * { box-sizing: border-box; }
        
        html, body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #e0eafc 0%, #cfdef3 100%);
            display: flex;
            flex-direction: column; /* Allows footer to stick to bottom */
        }

        /* 2. Main Wrapper - Pushes footer down */
        .main-content {
            flex: 1; 
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .profile-card {
            width: 100%;
            max-width: 500px;
            background: white;
            padding: 40px;
            border-radius: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            text-align: center;
            animation: slideUp 0.8s ease-out forwards;
        }

        /* 3. Animations */
        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes growBar { from { width: 0%; } }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0px rgba(0, 123, 255, 0.4); } 70% { box-shadow: 0 0 0 15px rgba(0, 123, 255, 0); } 100% { box-shadow: 0 0 0 0px rgba(0, 123, 255, 0); } }

        /* 4. Skills & UI Elements */
        .skill-row { margin-bottom: 25px; transition: transform 0.3s ease; }
        .skill-row:hover { transform: translateX(10px); }
        .skill-bar-bg { background: #eee; border-radius: 20px; height: 10px; overflow: hidden; }
        .skill-bar-fill { height: 100%; border-radius: 20px; animation: growBar 1.5s ease-out; }

        /* 5. Footer Layout */
        footer { 
            width: 100%;
            background: rgba(255, 255, 255, 0.8); 
            backdrop-filter: blur(10px);
            border-top: 1px solid rgba(0, 210, 255, 0.2);
            padding: 30px 0;
            margin-top: auto;
        }

        .footer-inner {
            max-width: 800px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        .footer-left { color: #64748b; font-size: 0.9rem; display: flex; align-items: center; gap: 10px; }
        .footer-left a { color: #0284c7; text-decoration: none; font-weight: 600; }
        
        .footer-right { display: flex; gap: 15px; }
        .footer-icon { 
            display: flex; align-items: center; justify-content: center; 
            width: 40px; height: 40px; border-radius: 50%; color: white; 
            transition: transform 0.2s ease;
        }
        .footer-icon:hover { transform: translateY(-3px); }
        .footer-icon.fb { background: #1877f2; }
        .footer-icon.yt { background: #ff0000; }

        @media (max-width: 600px) {
            .footer-inner { flex-direction: column-reverse; text-align: center; }
            .footer-left { flex-direction: column; }
        }
    </style>
